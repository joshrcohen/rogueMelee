name: Rogue source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  portable-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test delta format
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile portable patch and launch tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/package | Out-Null
          $compiler = 'C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:exe /main:PatchMod /platform:x64 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /out:build/package/PatchMod.exe (Resolve-Path tools/package/PatchMod.cs).Path (Resolve-Path tools/package/PatchCore.cs).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /target:winexe /platform:x64 /reference:System.Windows.Forms.dll /out:build/package/LaunchMod.exe (Resolve-Path tools/package/LaunchMod.cs).Path
          exit $LASTEXITCODE
